# MassClaw Redis Configuration

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (RDB snapshots)
save 900 1
save 300 10
save 60 10000

# Append-Only File
appendonly yes
appendfsync everysec

# Connection
tcp-keepalive 300
timeout 0

# Logging
loglevel notice

# Databases (0=cache, 1=pubsub, 2=rate-limit, 3=celery)
databases 16
