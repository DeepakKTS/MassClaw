version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: massclaw-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-massclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-massclaw}
      POSTGRES_DB: ${POSTGRES_DB:-massclaw}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-massclaw}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - massclaw-network

  redis:
    image: redis:7-alpine
    container_name: massclaw-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - massclaw-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: massclaw-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-massclaw}:${POSTGRES_PASSWORD:-massclaw}@postgres:5432/${POSTGRES_DB:-massclaw}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-massclaw}:${POSTGRES_PASSWORD:-massclaw}@postgres:5432/${POSTGRES_DB:-massclaw}
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - massclaw-network

  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: massclaw-celery-worker
    command: celery -A app.workers.celery_app worker -l info -Q health,trust,memory,workflow,audit
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-massclaw}:${POSTGRES_PASSWORD:-massclaw}@postgres:5432/${POSTGRES_DB:-massclaw}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-massclaw}:${POSTGRES_PASSWORD:-massclaw}@postgres:5432/${POSTGRES_DB:-massclaw}
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - massclaw-network

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: massclaw-celery-beat
    command: celery -A app.workers.celery_app beat -l info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-massclaw}:${POSTGRES_PASSWORD:-massclaw}@postgres:5432/${POSTGRES_DB:-massclaw}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-massclaw}:${POSTGRES_PASSWORD:-massclaw}@postgres:5432/${POSTGRES_DB:-massclaw}
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - massclaw-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: massclaw-frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - massclaw-network

volumes:
  postgres_data:
  redis_data:

networks:
  massclaw-network:
    driver: bridge
