[project]
name = "massclaw"
version = "0.1.0"
description = "Decentralized operating layer for AI agents"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sse-starlette>=2.0,<3.0",
    "websockets>=15.0,<16.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pgvector>=0.3,<1.0",
    # Validation & Settings
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    # Redis
    "redis[hiredis]>=5.2,<6.0",
    # Task Queue
    "celery[redis]>=5.4,<6.0",
    # HTTP Client
    "httpx>=0.28,<1.0",
    # Security
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    # LLM Providers
    "anthropic>=0.40,<1.0",
    "openai>=1.50,<2.0",
    # Embeddings
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    # Logging
    "structlog>=24.0,<25.0",
    # Retry Logic
    "tenacity>=9.0,<10.0",
    # Utilities
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
