name: Deploy (Fly.io × 3 regions)

# Deploys MassClaw to the three Fly.io regional apps (us, eu, ap) after the
# main CI workflow completes successfully on main. Each region runs its own
# Postgres + Redis (configured via `fly secrets`), so the three deployments
# are independent failure domains.
#
# Required repository secrets (set via Settings → Secrets → Actions):
#   FLY_API_TOKEN_US   — per-app deploy token from `fly tokens create deploy --app massclaw-us`
#   FLY_API_TOKEN_EU   — same for massclaw-eu
#   FLY_API_TOKEN_AP   — same for massclaw-ap
#
# If any of the secrets are missing the corresponding job is skipped — the
# other regions still deploy, so a single missing token doesn't block the
# whole fleet.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # Only proceed when the CI workflow finished successfully. `workflow_run`
  # fires on every CI completion (success OR failure), so this gate is
  # essential — otherwise we'd deploy broken code whenever tests fail.
  gate:
    name: Wait for CI success
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Record reason for deploy
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch"
          else
            echo "CI run ${{ github.event.workflow_run.id }} succeeded on ${{ github.event.workflow_run.head_sha }}"
          fi

  deploy-us:
    name: Deploy → massclaw-us
    needs: gate
    runs-on: ubuntu-latest
    environment: production-us
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Skip if no Fly token configured
        id: guard
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN_US }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::FLY_API_TOKEN_US not set — skipping us deploy"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skip == 'false'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - if: steps.guard.outputs.skip == 'false'
        name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_US }}
        run: flyctl deploy --remote-only --config deploy/fly/node-us.toml

  deploy-eu:
    name: Deploy → massclaw-eu
    needs: gate
    runs-on: ubuntu-latest
    environment: production-eu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Skip if no Fly token configured
        id: guard
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN_EU }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::FLY_API_TOKEN_EU not set — skipping eu deploy"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skip == 'false'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - if: steps.guard.outputs.skip == 'false'
        name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_EU }}
        run: flyctl deploy --remote-only --config deploy/fly/node-eu.toml

  deploy-ap:
    name: Deploy → massclaw-ap
    needs: gate
    runs-on: ubuntu-latest
    environment: production-ap
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Skip if no Fly token configured
        id: guard
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN_AP }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::FLY_API_TOKEN_AP not set — skipping ap deploy"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skip == 'false'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - if: steps.guard.outputs.skip == 'false'
        name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_AP }}
        run: flyctl deploy --remote-only --config deploy/fly/node-ap.toml
