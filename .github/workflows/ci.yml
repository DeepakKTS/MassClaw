name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "18"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: massclaw
          POSTGRES_PASSWORD: massclaw
          POSTGRES_DB: massclaw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U massclaw"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://massclaw:massclaw@localhost:5432/massclaw_test
      DATABASE_SYNC_URL: postgresql://massclaw:massclaw@localhost:5432/massclaw_test
      REDIS_URL: redis://localhost:6379/0
      AUTH_REQUIRED: "false"
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      TESTING: "1"
      # Cache sentence-transformers models between runs
      SENTENCE_TRANSFORMERS_HOME: ${{ github.workspace }}/.cache/sentence-transformers

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: .cache/sentence-transformers
          key: sentence-transformers-all-MiniLM-L6-v2-${{ runner.os }}

      - name: Install dependencies
        working-directory: backend
        run: pip install ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check app/

      - name: Format check
        working-directory: backend
        run: ruff format --check app/

      - name: Type check
        working-directory: backend
        run: mypy app/ || true

      - name: Create pgvector extension
        run: >
          PGPASSWORD=massclaw psql -h localhost -U massclaw -d massclaw_test
          -c "CREATE EXTENSION IF NOT EXISTS vector;"
          -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest tests/unit/ tests/integration/ -v --tb=short -x

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint
