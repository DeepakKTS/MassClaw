name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: massclaw
          POSTGRES_PASSWORD: massclaw
          POSTGRES_DB: massclaw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U massclaw"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          cd backend
          pip install ".[dev]"

      - name: Lint
        run: |
          cd backend
          ruff check app/

      - name: Format check
        run: |
          cd backend
          ruff format --check app/

      - name: Type check
        run: |
          cd backend
          mypy app/ || true

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://massclaw:massclaw@localhost:5432/massclaw_test
          DATABASE_SYNC_URL: postgresql://massclaw:massclaw@localhost:5432/massclaw_test
          REDIS_URL: redis://localhost:6379/0
          AUTH_REQUIRED: "false"
        run: |
          cd backend
          alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://massclaw:massclaw@localhost:5432/massclaw_test
          DATABASE_SYNC_URL: postgresql://massclaw:massclaw@localhost:5432/massclaw_test
          REDIS_URL: redis://localhost:6379/0
          AUTH_REQUIRED: "false"
          TESTING: "1"
        run: |
          cd backend
          pytest tests/ -v --tb=short

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        run: |
          cd frontend
          npm run build

      - name: Lint
        run: |
          cd frontend
          npm run lint
